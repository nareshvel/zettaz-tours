name: API first slice
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test_admin
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: zettaz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_admin -d zettaz_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://test_admin:disposable_ci_password@127.0.0.1:5432/zettaz_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run web:build
